<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>伪恐怖 · 深渊回响</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a0c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', 'SimSun', 'Microsoft YaHei', monospace;
      padding: 16px;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* 全局噪点层 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      animation: noiseShift 0.12s infinite;
    }

    @keyframes noiseShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-3%, -2%); }
      50% { transform: translate(2%, 3%); }
      75% { transform: translate(-1%, 2%); }
      100% { transform: translate(3%, -1%); }
    }

    /* 扫描线 */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 2;
      animation: scanline 8s linear infinite;
    }

    @keyframes scanline {
      0% { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }

    /* 画面闪烁/故障效果类 */
    .glitch-active {
      animation: glitchFlash 0.08s steps(2) infinite;
    }

    @keyframes glitchFlash {
      0% { filter: none; transform: translate(0); }
      20% { filter: invert(1) hue-rotate(90deg); transform: translate(-2px, 1px); }
      40% { filter: none; transform: translate(2px, -1px); }
      60% { filter: contrast(3) brightness(1.5); transform: translate(-1px, -2px); }
      80% { filter: invert(0.8) hue-rotate(-60deg); transform: translate(1px, 2px); }
      100% { filter: none; transform: translate(0); }
    }

    .shake-active {
      animation: shakeHard 0.12s linear infinite;
    }

    @keyframes shakeHard {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-6px, 4px); }
      50% { transform: translate(5px, -5px); }
      75% { transform: translate(-4px, -3px); }
      100% { transform: translate(6px, 5px); }
    }

    /* 主容器 */
    .horror-container {
      max-width: 720px;
      width: 100%;
      background: rgba(8, 8, 12, 0.92);
      border: 1px solid #1a1a22;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 1), inset 0 0 80px rgba(0, 0, 0, 0.9);
      padding: 24px 22px 28px;
      position: relative;
      z-index: 10;
      transition: all 0.1s;
    }

    /* 标题栏 */
    .horror-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e1e28;
      padding-bottom: 10px;
      margin-bottom: 18px;
    }

    .horror-header h1 {
      font-size: 1.3rem;
      font-weight: 400;
      color: #7a7a8a;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(120, 0, 0, 0.3);
      font-family: 'Courier New', monospace;
    }

    .horror-header h1 span {
      color: #4a0a0a;
      animation: pulseRed 3s infinite;
    }

    @keyframes pulseRed {
      0%, 100% { text-shadow: 0 0 4px rgba(180, 0, 0, 0.2); }
      50% { text-shadow: 0 0 20px rgba(180, 0, 0, 0.8), 0 0 40px rgba(180, 0, 0, 0.4); }
    }

    .horror-stats {
      display: flex;
      gap: 14px;
      font-size: 0.7rem;
      color: #3a3a4a;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .horror-stats span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 故事窗口 */
    .story-window {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #14141c;
      border-radius: 2px;
      padding: 24px 20px;
      min-height: 240px;
      margin-bottom: 18px;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 1);
      position: relative;
      overflow: hidden;
    }

    .story-window::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
    }

    .story-text {
      color: #b0b0b8;
      font-size: 0.95rem;
      line-height: 1.8;
      font-weight: 300;
      letter-spacing: 0.5px;
      word-break: break-word;
      white-space: pre-wrap;
      font-family: 'Courier New', 'SimSun', monospace;
      text-shadow: 0 0 6px rgba(100, 100, 120, 0.3);
      position: relative;
      z-index: 1;
      transition: color 0.15s;
    }

    .story-text.whisper {
      color: #4a4a5a;
      font-size: 0.85rem;
      font-style: italic;
    }

    .story-text.danger {
      color: #8a2a2a;
      text-shadow: 0 0 12px rgba(180, 0, 0, 0.6);
      animation: dangerPulse 1.5s infinite;
    }

    @keyframes dangerPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; color: #c03030; }
    }

    /* 选项区 */
    .choices-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .choice-btn {
      background: rgba(20, 20, 28, 0.8);
      border: 1px solid #22222e;
      border-radius: 2px;
      padding: 13px 18px;
      color: #909098;
      font-size: 0.9rem;
      font-weight: 400;
      text-align: left;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.5px;
      font-family: 'Courier New', 'SimSun', monospace;
      position: relative;
      overflow: hidden;
    }

    .choice-btn::before {
      content: '>';
      color: #3a3a4a;
      font-weight: bold;
      transition: all 0.15s;
      font-size: 0.85rem;
    }

    .choice-btn:hover:not(:disabled) {
      background: rgba(30, 15, 15, 0.9);
      border-color: #4a1a1a;
      color: #c0c0c8;
      transform: translateX(4px);
      box-shadow: inset 3px 0 0 #5a1a1a, 0 0 20px rgba(100, 0, 0, 0.15);
    }

    .choice-btn:hover:not(:disabled)::before {
      color: #8a2a2a;
      content: '>>';
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .choice-btn:active:not(:disabled) {
      transform: scale(0.98) translateX(4px);
      background: rgba(50, 10, 10, 0.9);
    }

    .choice-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      filter: blur(0.5px);
    }

    .choice-btn .badge {
      margin-left: auto;
      font-size: 0.6rem;
      color: #2a2a3a;
      border: 1px solid #1a1a24;
      padding: 1px 8px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    /* 结局提示块 */
    .ending-block {
      background: rgba(10, 0, 0, 0.5);
      border: 1px dashed #3a0a0a;
      border-radius: 2px;
      padding: 16px 18px;
      text-align: center;
      color: #5a3a3a;
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-family: 'Courier New', monospace;
      animation: endingFade 2s infinite;
    }

    @keyframes endingFade {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 底部控制 */
    .horror-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(15, 15, 22, 0.8);
      border: 1px solid #1a1a26;
      color: #5a5a6a;
      padding: 9px 20px;
      border-radius: 2px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.12s;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .action-btn:hover {
      background: rgba(40, 15, 15, 0.8);
      border-color: #4a1a1a;
      color: #a08080;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .restart-btn {
      color: #6a3a3a;
      border-color: #2a1212;
    }

    .restart-btn:hover {
      color: #c06060;
      border-color: #5a1a1a;
      box-shadow: 0 0 15px rgba(120, 0, 0, 0.3);
    }

    .status-hint {
      font-size: 0.65rem;
      color: #2a2a3a;
      letter-spacing: 1px;
      font-family: 'Courier New', monospace;
      padding: 6px 12px;
      border: 1px solid #14141c;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.4);
    }

    .status-hint i {
      font-style: normal;
      color: #4a1a1a;
      margin-right: 4px;
    }

    /* 全屏恐怖覆盖层 */
    .fear-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.08s;
    }

    .fear-overlay.flash-red {
      background: rgba(120, 0, 0, 0.35);
      opacity: 1;
    }

    .fear-overlay.flash-white {
      background: rgba(255, 255, 255, 0.25);
      opacity: 1;
    }

    .fear-overlay.flash-black {
      background: rgba(0, 0, 0, 0.9);
      opacity: 1;
    }

    /* 伪·鬼脸闪现（用 CSS 绘制） */
    .ghost-face {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 9998;
      pointer-events: none;
      opacity: 0;
      width: 300px;
      height: 400px;
      background: radial-gradient(circle at 50% 35%, #3a0a0a 0%, #0a0000 70%);
      border-radius: 45% 45% 40% 40% / 50% 50% 35% 35%;
      box-shadow: 0 0 80px rgba(150, 0, 0, 0.8), inset 0 0 60px rgba(0, 0, 0, 1);
      transition: all 0.06s;
    }

    .ghost-face::before {
      content: '';
      position: absolute;
      top: 28%;
      left: 22%;
      width: 22%;
      height: 12%;
      background: #0a0000;
      border-radius: 50%;
      box-shadow: 30px 0 0 #0a0000;
      filter: blur(3px);
    }

    .ghost-face::after {
      content: '';
      position: absolute;
      top: 55%;
      left: 32%;
      width: 36%;
      height: 8%;
      background: #1a0000;
      border-radius: 0 0 50% 50%;
      box-shadow: 0 0 15px #5a0000;
      filter: blur(4px);
    }

    .ghost-face.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.85;
      animation: ghostJitter 0.06s infinite;
    }

    @keyframes ghostJitter {
      0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      25% { transform: translate(-52%, -48%) scale(1.02) rotate(1deg); }
      50% { transform: translate(-48%, -52%) scale(0.98) rotate(-1deg); }
      75% { transform: translate(-51%, -49%) scale(1.01) rotate(0.5deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }

    @media (max-width: 480px) {
      .horror-container {
        padding: 18px 14px 22px;
      }
      .horror-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .horror-header h1 {
        font-size: 1.1rem;
        letter-spacing: 3px;
      }
      .horror-stats {
        font-size: 0.65rem;
      }
      .story-window {
        padding: 18px 14px;
        min-height: 190px;
      }
      .story-text {
        font-size: 0.85rem;
        line-height: 1.7;
      }
      .choice-btn {
        padding: 11px 14px;
        font-size: 0.8rem;
      }
      .horror-footer {
        flex-direction: column;
        align-items: stretch;
      }
      .action-btn {
        justify-content: center;
      }
      .ghost-face {
        width: 220px;
        height: 300px;
      }
    }
  </style>
</head>
<body>

<!-- 伪·鬼脸闪现 -->
<div class="ghost-face" id="ghostFace"></div>
<!-- 全屏恐怖闪光层 -->
<div class="fear-overlay" id="fearOverlay"></div>

<div class="horror-container" id="horrorContainer">
  <div class="horror-header">
    <h1>深渊<span>回响</span></h1>
    <div class="horror-stats">
      <span>▶ 步数 <span id="stepCounter">0</span></span>
      <span>▲ 痕迹 <span id="flagCounter">0</span></span>
      <span>◉ 理智 <span id="sanityDisplay">100</span>%</span>
    </div>
  </div>

  <div class="story-window">
    <div class="story-text" id="storyDisplay">
      你醒了。周围一片漆黑，只有指尖触碰到冰冷的墙壁。你不记得自己是谁，也不记得为何在此。唯一能听见的，是自己的心跳——还有，远处传来的、若有若无的滴水声。
    </div>
  </div>

  <div class="choices-panel" id="choicesContainer">
    <!-- 动态渲染 -->
  </div>

  <div class="horror-footer">
    <button class="action-btn restart-btn" id="restartBtn">⟲ 重启循环</button>
    <div class="status-hint">
      <i>◈</i> <span id="stateHint">你在黑暗中摸索……</span>
    </div>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ============================================================
    //  伪恐怖游戏 · 深渊回响
    //  核心：文游叙事 + 心理暗示 + 突发惊吓
    // ============================================================

    // ---------- 故事数据 ----------
    // 每个节点： { id, text, textClass?, choices: [ { text, nextId, sanityCost?, triggerFear? } ] }
    // 当 choices 为空数组时，表示结局节点
    // 特殊字段：
    //   sanityCost: 扣除理智值（默认0）
    //   triggerFear: true 时触发恐怖特效
    //   flag: 添加一个标记
    const storyGraph = {
      // 初始场景
      start: {
        id: 'start',
        text: '你醒了。周围一片漆黑，只有指尖触碰到冰冷的墙壁。\n\n你不记得自己是谁，也不记得为何在此。唯一能听见的，是自己的心跳——还有，远处传来的、若有若无的滴水声。',
        choices: [
          { text: '◈ 触摸墙壁，沿着通道摸索前行', nextId: 'corridor' },
          { text: '◈ 大声呼喊，希望有人回应', nextId: 'shout', sanityCost: 5 },
          { text: '◈ 蹲下身，在黑暗中静静等待', nextId: 'wait', sanityCost: 3 }
        ]
      },
      corridor: {
        id: 'corridor',
        text: '你的指尖划过潮湿的墙面，苔藓的触感让你一阵恶心。水滴声越来越近，越来越清晰。\n\n突然，你摸到一道门缝——门后似乎有微弱的光。',
        choices: [
          { text: '◈ 推开门，走进光亮处', nextId: 'room' },
          { text: '◈ 犹豫片刻，还是退回黑暗中', nextId: 'darkness', sanityCost: 8, triggerFear: true },
          { text: '◈ 用身体撞开门，冲进去', nextId: 'room', sanityCost: 3 }
        ]
      },
      shout: {
        id: 'shout',
        text: '你的声音在通道中回荡，撞上墙壁，又反弹回来……变成了某种不属于你的低语。\n\n“你……不应该……醒来的……”',
        textClass: 'danger',
        choices: [
          { text: '◈ 屏住呼吸，假装什么都没听见', nextId: 'corridor', sanityCost: 10 },
          { text: '◈ 追问：“你是谁？！”', nextId: 'voice', sanityCost: 15, triggerFear: true },
          { text: '◈ 捂住耳朵，拼命往前跑', nextId: 'corridor', sanityCost: 8, triggerFear: true }
        ]
      },
      wait: {
        id: 'wait',
        text: '你蹲在原地，闭上了眼睛。\n\n黑暗中，有什么东西在靠近。你感觉到了呼吸——温热、潮湿，拂过你的后颈。\n\n但你不敢睁眼。',
        textClass: 'whisper',
        choices: [
          { text: '◈ 继续闭眼，一动不动', nextId: 'breath', sanityCost: 15, triggerFear: true },
          { text: '◈ 猛地转身，直面黑暗', nextId: 'face', sanityCost: 20, triggerFear: true },
          { text: '◈ 爬起来，朝反方向狂奔', nextId: 'corridor', sanityCost: 12, triggerFear: true }
        ]
      },
      room: {
        id: 'room',
        text: '门后是一间狭小的房间。中央有一面镜子，镜面上满是裂纹。\n\n奇怪的是，镜子里的“你”似乎比你慢了半拍。你抬手，镜中人的手却停在空中。',
        choices: [
          { text: '◈ 凑近镜子，仔细观察', nextId: 'mirror', sanityCost: 8 },
          { text: '◈ 拿起旁边的椅子，砸向镜子', nextId: 'smash', sanityCost: 12, triggerFear: true },
          { text: '◈ 转身离开这个房间', nextId: 'corridor', sanityCost: 5 }
        ]
      },
      mirror: {
        id: 'mirror',
        text: '你凑近镜子。镜中的“你”也凑近——但它笑了，而你并没有笑。\n\n它的嘴唇无声地翕动，你读出了它的口型：\n\n“换……你……进……来……”',
        textClass: 'danger',
        choices: [
          { text: '◈ 后退，远离镜子', nextId: 'room', sanityCost: 15 },
          { text: '◈ 伸出手，触碰镜面', nextId: 'touch', sanityCost: 25, triggerFear: true },
          { text: '◈ 闭上眼，默念“这不是真的”', nextId: 'deny', sanityCost: 10 }
        ]
      },
      touch: {
        id: 'touch',
        text: '你的指尖触碰到镜面——冰冷，柔软，像皮肤。\n\n镜中的“你”一把抓住了你的手腕。\n\n你挣扎，但它的力气太大了。你被一点点拉向镜面……',
        textClass: 'danger',
        choices: [
          { text: '◈ 拼命挣扎', nextId: 'struggle', sanityCost: 30, triggerFear: true },
          { text: '◈ 放弃抵抗，任由它拉你进去', nextId: 'inside_mirror', sanityCost: 20 }
        ]
      },
      struggle: {
        id: 'struggle',
        text: '你用尽全力向后拉扯——手腕上传来剧痛。\n\n你摔倒在地。抬头看时，镜面已经恢复平静。但你的手腕上，多了一圈淤青，形状像一只手掌。\n\n房间里恢复了死寂。',
        choices: [
          { text: '◈ 爬起来，逃离这个房间', nextId: 'corridor', sanityCost: 10 },
          { text: '◈ 再次看向镜子', nextId: 'mirror', sanityCost: 15, triggerFear: true }
        ]
      },
      inside_mirror: {
        id: 'inside_mirror',
        text: '你被拉进了镜子里。\n\n这里的一切都是反的。你看见“自己”站在镜外，朝你微笑，然后转身走远。\n\n你被困在了镜中。永远。\n\n💀 结局：镜囚 💀',
        textClass: 'danger',
        choices: []
      },
      deny: {
        id: 'deny',
        text: '你紧闭双眼，反复告诉自己“这不是真的”。\n\n当你再次睁开眼时，镜子里只剩下你自己的倒影。一切正常。\n\n但你的眼角余光瞥见——镜中人的嘴角，似乎还残留着一丝笑意。',
        choices: [
          { text: '◈ 不再看镜子，转身离开', nextId: 'corridor', sanityCost: 5 },
          { text: '◈ 砸碎镜子', nextId: 'smash', sanityCost: 10, triggerFear: true }
        ]
      },
      smash: {
        id: 'smash',
        text: '你举起椅子，狠狠砸向镜面。\n\n玻璃碎片四溅——但每一片碎片里，都映出你的脸。无数个“你”在碎片中尖叫。\n\n那些尖叫声，渐渐变成了你的声音。',
        textClass: 'danger',

    // 触发鬼脸闪现

      // 同时触发画面抖动
      horrorContainer.classList.add('shake-active');
      setTimeout(() => {
        ghostFace.classList.remove('show');
        horrorContainer.classList.remove('shake-active');
      }, duration);
    }

    // 触发全屏颜色闪烁
    function flashScreen(type = 'red', duration = 120) {
      fearOverlay.className = 'fear-overlay flash-' + type;
      setTimeout(() => {
        fearOverlay.className = 'fear-overlay';
      }, duration);
    }

    // 触发故障效果
    function triggerGlitch(duration = 300) {
      horrorContainer.classList.add('glitch-active');
      setTimeout(() => {
        horrorContainer.classList.remove('glitch-active');
      }, duration);
    }

    // 综合恐怖触发
    function triggerFearEffect(intensity = 'normal') {
      // 清除之前的定时器
      if (fearTimeout) clearTimeout(fearTimeout);
      if (glitchTimeout) clearTimeout(glitchTimeout);

      if (intensity === 'light') {
        flashScreen('black', 80);
        triggerGlitch(150);
      } else if (intensity === 'normal') {
        flashScreen('red', 100);
        triggerGlitch(200);
        setTimeout(() => showGhostFace(180), 60);
      } else if (intensity === 'heavy') {
        flashScreen('white', 60);
        setTimeout(() => flashScreen('red', 80), 60);
        triggerGlitch(350);
        setTimeout(() => showGhostFace(300), 50);
        // 画面剧烈抖动
        horrorContainer.classList.add('shake-active');
        setTimeout(() => horrorContainer.classList.remove('shake-active'), 400);
      }
    }
